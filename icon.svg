<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
    </pattern>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <circle cx="420" cy="90" r="150" fill="#ffffff" fill-opacity="0.10" filter="url(#soft)"/>
    <circle cx="80" cy="440" r="140" fill="#0f2a6b" fill-opacity="0.35" filter="url(#soft)"/>
  </g>
  <!-- C harfi: teknik çizim gibi kalın yay (sola yaslı) -->
  <path d="M250 174A104 104 0 1 0 250 338" fill="none" stroke="#ffffff" stroke-width="50" stroke-linecap="round"/>
  <!-- Y harfi -->
  <path d="M296 196l62 70 62-70M358 266v86" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Yaprak: bahçe / doğa vurgusu, Y'nin sağ kolunun ucunda -->
  <path d="M446 118c-52-4-92 26-100 78 52 6 96-26 100-78z" fill="url(#leaf)"/>
  <path d="M446 118c-30 22-56 48-80 74" fill="none" stroke="#166534" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
</svg>
